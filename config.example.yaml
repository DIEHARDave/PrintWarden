# Copy to config/config.yaml and edit.

# Paths inside the container (see docker-compose.yml).
output_dir: /output/3D-Prints  # on the mounted NAS share; videos land in <output_dir>/<printer name>/
work_dir: /work              # scratch space for frames while rendering
state_file: /data/state.json # remembers which frame sets were rendered
# Printers and detection/alert settings saved from the web page live here. Once it
# exists, its printer list replaces the printers: list at the bottom of this file.
settings_file: /data/settings.json

# Turn moonraker-timelapse's on-printer render off on each printer at connect,
# so the printer never spends time (or storage) making its own video.
disable_printer_render: true
# Also render cancelled or failed prints.
render_cancelled: false
# When a printer (re)connects idle with frames we haven't rendered, render them.
catch_up: true
# After a render succeeds and the video is on the NAS, delete the loose frames
# from the printer. moonraker-timelapse registers its frames folder read-only,
# so this only works where that folder sits inside a writable root (Zmod keeps
# it in gcodes/timelapse/tmp); elsewhere it's skipped and the plugin clears
# the frames itself when the next print starts. Never runs mid-print.
# (Sync-mode printers like the U1 use delete_after_sync instead, per printer.)
delete_frames_after_render: true
# With "Save Frames" on in a printer's timelapse settings, each completed print
# leaves a <name>_frames.zip in its timelapse folder, which is rendered instead
# of the loose frames. Delete that zip from the printer once the video is saved.
delete_saved_frames: true

download_concurrency: 4      # parallel frame downloads per printer
max_parallel_renders: 1      # ffmpeg jobs at once across all printers
sync_interval: 300           # how often (s) a sync-mode printer is polled

# Frame rate, rotation/flip, duplicate-last-frame, target length and preview image
# come from each printer's own timelapse settings in Mainsail/Fluidd.
ffmpeg:
  codec: libx264
  crf: 23        # lower = better quality, bigger file
  preset: medium # the PC has the CPU the printer lacks; slow/slower is fine too
  extra: []      # e.g. ["-tune", "film"]

# Failure ("spaghetti") detection on webcam snapshots while printing. Turn it on
# per printer with detect: alert | pause (or on the web page).
detection:
  interval: 10       # seconds between checks while printing (scoring is tuned for 10)
  threads: 1         # CPU threads per check; checks run one at a time
  # model_dir: /data/models     # the ~200 MB model is downloaded here on first use
  # flagged_dir: /data/flagged  # frames that triggered an alert or pause

notify:
  discord_webhook: ""  # https://discord.com/api/webhooks/... ; alerts post the snapshot
  console: true        # also show alerts in the printer console (RESPOND)

web:
  enabled: true
  port: 8095         # monitor + settings page: http://<docker host>:8095/

printers:
  - name: AD5X-1
    host: 10.0.1.198
    detect: pause         # off (default) | alert | pause
    # webcam: ""          # Moonraker webcam name; empty = first one with snapshots
    # sensitivity: 1.0    # higher flags failures sooner (0.1..5)
  - name: AD5X-2
    host: 10.0.1.179
  - name: Creator5
    host: 10.0.1.107
    # Fetch the frames as one zip instead of ~1000 separate requests. Moonraker
    # builds it uncompressed (no CPU cost) in zip_root, which must be writable
    # and have room for one extra copy of the frames; it's deleted after the
    # download. On any failure this falls back to frame-by-frame.
    fetch: zip            # "files" (default) or "zip"
    # zip_root: timelapse
  - name: T1
    host: 10.0.1.195
  # mode: "off" skips timelapses for a printer (detection only).
  # port: 7125 and api_key: "" are the defaults; set api_key if the
  # printer doesn't trust the Docker host's address.

  # Snapmaker U1 and other printers that render timelapses on-device: they
  # don't expose raw frames, so instead of offloading the render we just copy
  # the finished videos to the NAS. mode "sync" polls a file root and pulls
  # anything new.
  - name: U1
    host: 10.0.1.173
    mode: sync
    # sync_root: timelapse            # Moonraker file root holding the videos
    # sync_suffixes: [".mp4", "_cover.jpg"]   # which files to copy
    # delete_after_sync: false        # true also removes them from the printer

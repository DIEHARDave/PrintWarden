# Timelapses on an SMB/CIFS share instead of a local volume. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.nas.yml up -d
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.nas.yml in .env.
# Needs cifs-utils on the Docker host and NAS_SHARE / NAS_USER /
# NAS_PASSWORD in .env.
services:
  printwarden:
    volumes:
      - nas:/output

volumes:
  nas:
    driver: local
    driver_opts:
      type: cifs
      device: ${NAS_SHARE}
      o: "username=${NAS_USER},password=${NAS_PASSWORD},uid=1000,gid=1000,file_mode=0664,dir_mode=0775,vers=3.0"

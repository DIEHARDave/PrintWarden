services:
  printwarden:
    image: ghcr.io/diehardave/printwarden:latest
    build: .
    container_name: printwarden
    restart: unless-stopped
    ports:
      - "8095:8095"   # monitor + settings page
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config:ro   # optional config.yaml; printers can be added on the page
      - work:/work
      - data:/data            # settings, detection models, flagged frames
      - output:/output        # rendered timelapses (docker-compose.nas.yml puts them on a NAS)

volumes:
  work:
  data:
  output:

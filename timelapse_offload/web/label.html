<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Frame</title>
<base href="../">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #eef0f3; --text: #1b1e23; --muted: #626b78;
  --line: #d9dde3; --accent: #2f6fdf; --ok: #23915a; --warn: #c98316; --bad: #d23a3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1b1e24; --panel-2: #23272e; --text: #e7e9ed; --muted: #98a1ad;
    --line: #2e333b; --accent: #5b92f0; --ok: #3cb878; --warn: #e3a13b; --bad: #ef5b5b;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12.5px; }
header .spacer { flex: 1; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, .btn { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .btn:hover { border-color: var(--accent); text-decoration: none; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
main { padding: 16px; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.stage { position: relative; display: inline-block; max-width: 100%; line-height: 0; background: #000;
  border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; cursor: crosshair; }
.stage img { display: block; max-width: 100%; max-height: calc(100vh - 110px); width: auto; height: auto; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage rect { fill-opacity: .12; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; }
.stage rect.sel { stroke-width: 3.5; fill-opacity: .25; stroke-dasharray: 6 4; }
.stage text { font: 600 13px system-ui, sans-serif; paint-order: stroke; stroke: #000; stroke-width: 3px; fill: #fff; pointer-events: none; }
.side { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.side h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
.types { display: grid; gap: 4px; }
.types button { display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; }
.types button .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.types button .key { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.types button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.verdict { display: grid; gap: 4px; }
.verdict label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.boxes { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.boxes li { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.boxes li.sel { background: var(--panel-2); }
.boxes li .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.boxes li button { margin-left: auto; padding: 0 6px; font-size: 12px; }
textarea { width: 100%; min-height: 60px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msg { font-size: 12.5px; color: var(--muted); }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
/* list of collected frames */
.gallery { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; color: var(--text); }
.item:hover { border-color: var(--accent); text-decoration: none; }
.item img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.item div { padding: 6px 8px; font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.chip.problem { color: var(--bad); } .chip.fine { color: var(--ok); } .chip.none { color: var(--warn); }
.center { padding: 60px 16px; text-align: center; color: var(--muted); }
@media (max-width: 860px) {
  main { padding: 16px; }
  .work { grid-template-columns: 1fr; }
  .stage img { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Training frames</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <a id="listLink" href="label/" hidden>All frames</a>
  <a href="api/training/export.zip" title="Every labelled frame as a YOLO dataset (images, labels, classes.txt) plus the JSON records">Export</a>
  <a href="./">Printer Monitor</a>
</header>
<main>
  <div class="center" id="loading">Loading…</div>

  <section id="editor" hidden>
    <div class="work">
      <div><div class="stage" id="stage"><img id="img" alt="Camera frame"><svg id="svg"></svg></div></div>
      <aside class="side">
        <div>
          <h2>Problem type</h2>
          <div class="types" id="types"></div>
          <p class="hint" style="margin-top:6px">Drag on the picture to box a problem. Click a box to select it; pick a type to change it; Delete removes it.</p>
        </div>
        <div>
          <h2>Boxes</h2>
          <ul class="boxes" id="boxes"></ul>
          <p class="hint" id="noBoxes">None yet.</p>
        </div>
        <div>
          <h2>This frame</h2>
          <div class="verdict" id="verdict">
            <label><input type="radio" name="verdict" value="problem"> Shows a problem</label>
            <label><input type="radio" name="verdict" value="fine"> Looks fine (false alarm or good print)</label>
            <label><input type="radio" name="verdict" value="unsure"> Not sure</label>
          </div>
        </div>
        <div>
          <h2>Note</h2>
          <textarea id="note" placeholder="Optional: what happened, filament, anything that helps later"></textarea>
        </div>
        <div class="row">
          <button class="primary" id="save" title="Ctrl+S">Save</button>
          <button id="saveClose">Save and close</button>
          <button class="danger" id="discard" title="Delete this frame from the training data">Discard</button>
        </div>
        <span class="msg" id="msg"></span>
      </aside>
    </div>
  </section>

  <section id="list" hidden>
    <p class="hint" id="listHint" style="margin-bottom:12px"></p>
    <div class="gallery" id="gallery"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["#ff4d4f", "#ffa940", "#fadb14", "#73d13d", "#36cfc9", "#4096ff", "#b37feb", "#f759ab"];
let LABELS = {}, KEYS = [], frame = null, boxes = [], current = null, sel = -1, dirty = false;

const color = (label) => COLORS[Math.max(0, KEYS.indexOf(label)) % COLORS.length];
const when = (t) => t ? new Date(t * 1000).toLocaleString() : "";

async function api(path, opts = {}) {
  const res = await fetch(path, { cache: "no-store", ...opts,
    headers: opts.body ? { "Content-Type": "application/json" } : undefined });
  if (!res.ok) throw new Error((await res.text().catch(() => "")) || res.status);
  return res.json();
}

// ---------- editor ----------
function drawTypes() {
  $("types").innerHTML = KEYS.map((k, i) => `<button type="button" data-type="${k}" class="${k === current ? "on" : ""}">
    <span class="sw" style="background:${color(k)}"></span>${esc(LABELS[k])}<span class="key">${i + 1}</span></button>`).join("");
}
function drawBoxes() {
  const [w, h] = frame.size;
  $("svg").setAttribute("viewBox", `0 0 ${w} ${h}`);
  $("svg").setAttribute("preserveAspectRatio", "none");
  const fs = Math.max(12, w / 70);
  $("svg").innerHTML = boxes.map((b, i) => `<g data-i="${i}">
    <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" stroke="${color(b.label)}" fill="${color(b.label)}" class="${i === sel ? "sel" : ""}"/>
    <text x="${b.x + 4}" y="${Math.max(fs, b.y - 4)}" style="font-size:${fs}px">${esc(LABELS[b.label] || b.label)}</text></g>`).join("")
    + `<rect id="draft" hidden stroke="#fff" fill="#fff" stroke-dasharray="6 4"/>`;
  $("boxes").innerHTML = boxes.map((b, i) => `<li data-i="${i}" class="${i === sel ? "sel" : ""}">
    <span class="sw" style="background:${color(b.label)}"></span>${esc(LABELS[b.label] || b.label)}
    <button type="button" data-del="${i}" title="Remove">✕</button></li>`).join("");
  $("noBoxes").hidden = boxes.length > 0;
  // Boxing a problem means the frame shows one, unless the user chose otherwise
  if (boxes.length && !document.querySelector('[name="verdict"]:checked')) setVerdict("problem");
}
function setVerdict(v) {
  document.querySelectorAll('[name="verdict"]').forEach((r) => { r.checked = r.value === v; });
}
function mark() { dirty = true; $("msg").className = "msg"; $("msg").textContent = "Not saved"; }

function imgPoint(e) {
  const r = $("img").getBoundingClientRect();
  const [w, h] = frame.size;
  return [Math.max(0, Math.min(w, (e.clientX - r.left) * w / r.width)),
          Math.max(0, Math.min(h, (e.clientY - r.top) * h / r.height))];
}
let drag = null;
$("stage").addEventListener("pointerdown", (e) => {
  const g = e.target.closest("g[data-i]");
  if (g) { sel = +g.dataset.i; current = boxes[sel].label; drawTypes(); drawBoxes(); return; }
  if (e.button !== 0) return;
  e.preventDefault();
  $("stage").setPointerCapture(e.pointerId);
  drag = { start: imgPoint(e) };
});
$("stage").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const [x0, y0] = drag.start, [x1, y1] = imgPoint(e);
  const d = $("draft");
  d.removeAttribute("hidden");
  d.setAttribute("x", Math.min(x0, x1)); d.setAttribute("y", Math.min(y0, y1));
  d.setAttribute("width", Math.abs(x1 - x0)); d.setAttribute("height", Math.abs(y1 - y0));
});
const endDrag = (e) => {
  if (!drag) return;
  const [x0, y0] = drag.start, [x1, y1] = imgPoint(e);
  drag = null;
  const b = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0), label: current };
  // A click (no real drag) just clears the selection
  if (b.w * 400 / frame.size[0] < 4 || b.h * 400 / frame.size[0] < 4) { sel = -1; drawBoxes(); return; }
  boxes.push(b); sel = boxes.length - 1; mark(); drawBoxes();
};
$("stage").addEventListener("pointerup", endDrag);
$("stage").addEventListener("pointercancel", () => { drag = null; drawBoxes(); });

$("types").addEventListener("click", (e) => {
  const b = e.target.closest("[data-type]");
  if (!b) return;
  current = b.dataset.type;
  if (sel >= 0) { boxes[sel].label = current; mark(); }
  drawTypes(); drawBoxes();
});
$("boxes").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { boxes.splice(+del.dataset.del, 1); sel = -1; mark(); drawBoxes(); return; }
  const li = e.target.closest("li[data-i]");
  if (li) { sel = +li.dataset.i; current = boxes[sel].label; drawTypes(); drawBoxes(); }
});
$("verdict").addEventListener("change", mark);
$("note").addEventListener("input", mark);
document.addEventListener("keydown", (e) => {
  if ($("editor").hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(false); return; }
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= KEYS.length) { $("types").children[n - 1].click(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && sel >= 0) { boxes.splice(sel, 1); sel = -1; mark(); drawBoxes(); }
  if (e.key === "Escape") { sel = -1; drawBoxes(); }
});
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

async function save(close) {
  const v = document.querySelector('[name="verdict"]:checked')?.value;
  if (!v) { $("msg").className = "msg bad"; $("msg").textContent = "Choose whether this frame shows a problem"; return; }
  try {
    frame = await api(`api/training/${frame.id}`, { method: "PUT",
      body: JSON.stringify({ boxes, verdict: v, note: $("note").value }) });
    boxes = frame.boxes; dirty = false;
    $("msg").className = "msg ok"; $("msg").textContent = "Saved";
    drawBoxes();
    if (close) { window.close(); setTimeout(() => { location.href = "label/"; }, 200); }
  } catch (e) { $("msg").className = "msg bad"; $("msg").textContent = "Not saved: " + e.message; }
}
$("save").onclick = () => save(false);
$("saveClose").onclick = () => save(true);
$("discard").onclick = async () => {
  if (!confirm("Delete this frame from the training data?")) return;
  await api(`api/training/${frame.id}`, { method: "DELETE" }).catch(() => {});
  dirty = false;
  window.close();
  setTimeout(() => { location.href = "label/"; }, 200);
};

function openFrame(f) {
  frame = f; boxes = f.boxes || []; sel = -1; dirty = false;
  current = current || KEYS[0];
  history.replaceState(null, "", `label/?id=${encodeURIComponent(f.id)}`);
  $("title").textContent = "Label frame";
  $("meta").textContent = [f.printer, when(f.taken), f.filename ? `${f.filename}${f.progress ? ` · ${Math.round(f.progress * 100)}%` : ""}` : "",
    f.source && f.source !== "camera" ? "from a flagged frame" : ""].filter(Boolean).join(" · ");
  $("listLink").hidden = false;
  setVerdict(f.verdict);
  $("note").value = f.note || "";
  $("img").onload = () => { $("loading").hidden = true; $("editor").hidden = false; drawTypes(); drawBoxes(); };
  $("img").src = `api/training/${encodeURIComponent(f.id)}.jpg`;
}

// ---------- list ----------
async function showList() {
  const d = await api("api/training");
  $("title").textContent = "Training frames";
  const done = d.items.filter((i) => i.verdict).length;
  $("meta").textContent = `${d.items.length} frame${d.items.length === 1 ? "" : "s"}, ${done} labelled`;
  $("listHint").textContent = d.items.length
    ? "Frames taken with the camera button on Printer Monitor, or copied from flagged frames. Click one to label it. Export downloads the labelled ones as a YOLO dataset."
    : "No frames yet. Use the camera button at the bottom of a printer's camera on Printer Monitor, or the ✎ on a flagged frame in its Activity list.";
  $("gallery").innerHTML = d.items.map((i) => {
    const counts = {};
    (i.boxes || []).forEach((b) => { counts[b.label] = (counts[b.label] || 0) + 1; });
    return `<a class="item" href="label/?id=${encodeURIComponent(i.id)}"><img loading="lazy" src="api/training/${encodeURIComponent(i.id)}.jpg" alt="">
      <div><b>${esc(i.printer)}</b><span class="chip ${i.verdict || "none"}">${i.verdict ? esc(i.verdict) : "not labelled"}</span>
      ${Object.entries(counts).map(([k, n]) => `<span class="chip">${esc(LABELS[k] || k)}${n > 1 ? " ×" + n : ""}</span>`).join("")}
      <span class="chip">${esc(when(i.taken))}</span></div></a>`;
  }).join("");
  $("loading").hidden = true; $("list").hidden = false;
}

// ---------- start ----------
(async () => {
  try {
    const meta = await api("api/training/labels");
    LABELS = meta.labels; KEYS = Object.keys(LABELS);
    const q = new URLSearchParams(location.search);
    if (q.get("printer")) {
      $("loading").textContent = `Taking a frame from ${q.get("printer")}…`;
      openFrame(await api("api/training/capture", { method: "POST", body: JSON.stringify({ printer: q.get("printer") }) }));
    } else if (q.get("flagged")) {
      const [printer, file] = q.get("flagged").split("/");
      openFrame(await api("api/training/from-flagged", { method: "POST", body: JSON.stringify({ printer, file }) }));
    } else if (q.get("id")) {
      openFrame(await api(`api/training/${encodeURIComponent(q.get("id"))}`));
    } else {
      await showList();
    }
  } catch (e) {
    $("loading").textContent = "Could not load: " + e.message;
  }
})();
</script>
</body>
</html>
